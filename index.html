<script type="text/babel" data-type="module">
const { useState, useEffect, useRef, useCallback } = React;

// Build-versielabel: handmatig bijgewerkt bij elke push, zichtbaar rechtsonder in de app.
// Zo is bij elke test direct duidelijk welke fix daadwerkelijk live staat.
const APP_BUILD = "fix-27 · 2026-10-23 23:50";

// Prijzen per miljoen tokens (USD), voor het schatten van API-kosten per sessie.
const MODEL_PRICING = {
  "claude-haiku-5-5": { in: 0.10, out: 0.50 },
  "claude-sonnet-5-5": { in: 2.00, out: 10.00 },
};
function calcCost(modelId, inputTokens, outputTokens) {
  const p = MODEL_PRICING[modelId] || MODEL_PRICING["claude-haiku-5-5"];
  return (inputTokens / 1e6) * p.in + (outputTokens / 1e6) * p.out;
}

// Haalt het eerste tekstblok uit een Anthropic-API-respons. Claude-modellen
// kunnen content-blokken van verschillende types teruggeven (bv. "thinking"
// vóór "text"), dus we pakken niet blind content[0] maar zoeken het eerste
// blok van het type "text".
function extractText(data) {
  const block = data?.content?.find(b => b && b.type === "text" && b.text);
  return block ? block.text : null;
}

// Modellen zetten soms een letterlijke regelovergang (newline/tab) binnen een
// JSON-stringwaarde i.p.v. de geëscapete vorm (\n), wat JSON.parse laat
// struikelen met "Unterminated string". Deze scanner loopt teken voor teken
// door de tekst, houdt bij of we ons binnen een string bevinden, en escaped
// letterlijke control characters daar alsnog — zonder de JSON-structuur zelf
// aan te raken.
function sanitizeJsonText(text) {
  let result = "";
  let inString = false;
  let escaped = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (inString) {
      if (escaped) { result += ch; escaped = false; continue; }
      if (ch === "\\") { result += ch; escaped = true; continue; }
      if (ch === "\"") { inString = false; result += ch; continue; }
      if (ch === "\n") { result += "\\n"; continue; }
      if (ch === "\r") { result += "\\r"; continue; }
      if (ch === "\t") { result += "\\t"; continue; }
      result += ch;
    } else {
      if (ch === "\"") { inString = true; result += ch; continue; }
      result += ch;
    }
  }
  return result;
}

// Maakt URL's in een foutmelding klikbaar (bv. de Firestore-index-aanmaaklink
// die Firebase meegeeft bij een failed-precondition fout).
function linkify(text) {
  const parts = String(text).split(/(https?:\/\/[^\s)]+)/g);
  return parts.map((part, i) =>
    /^https?:\/\//.test(part)
      ? <a key={i} href={part} target="_blank" rel="noopener noreferrer" style={{color:"#ffd9dd",textDecoration:"underline"}}>{part}</a>
      : part
  );
}

// fix-26: eenvoudige slug voor pd_authors-document-ids, zodat dezelfde naam
// niet dubbel wordt opgeslagen (hoofdletterongevoelig, spaties -> "-").
function slugifyName(name) {
  return String(name).trim().toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "") || "naam";
}

const INTERVIEW_STAGES = [
  { id:"context", label:{nl:"Context",en:"Context"}, questions:[
    {nl:"Wat is de naam of werktitel van deze feature?",en:"What is the name or working title of this feature?"},
    {nl:"Beschrijf in één zin wat je wil oplossen of bereiken.",en:"Describe in one sentence what you want to solve or achieve."},
    {nl:"In welke afdeling of context speelt dit zich af?",en:"In which department or context does this take place?"},
  ]},
  { id:"problem", label:{nl:"Het Probleem",en:"The Problem"}, questions:[
    {nl:"Welk concreet probleem ervaren mensen nu? Kun je een voorbeeld geven van wanneer dit misgaat?",en:"What concrete problem are people experiencing now? Can you give an example of when this goes wrong?"},
    {nl:"Hoe lang bestaat dit probleem al en waarom wordt het nu pas opgepakt?",en:"How long has this problem existed and why is it only being addressed now?"},
    {nl:"Wat zijn de gevolgen als we dit probleem NIET oplossen? Wat kost het de organisatie?",en:"What are the consequences if we do NOT solve this problem? What does it cost the organisation?"},
    {nl:"Hoe wordt dit nu opgelost (workarounds)? Wat werkt er niet aan die aanpak?",en:"How is this currently solved (workarounds)? What doesn't work about that approach?"},
  ]},
  { id:"goal", label:{nl:"Het Doel",en:"The Goal"}, questions:[
    {nl:"Wat wil je concreet bereiken? Hoe ziet succes eruit over 6 maanden?",en:"What do you concretely want to achieve? What does success look like in 6 months?"},
    {nl:"Welk overkoepelend bedrijfsdoel draagt dit bij? Is dit strategisch geprioriteerd?",en:"Which overarching business objective does this contribute to? Is this strategically prioritised?"},
    {nl:"Hoe meet je of deze feature geslaagd is? Welke KPIs of metrics gebruik je?",en:"How do you measure whether this feature is successful? Which KPIs or metrics do you use?"},
  ]},
  { id:"users", label:{nl:"Gebruikers",en:"Users"}, questions:[
    {nl:"Wie zijn de primaire gebruikers van de oplossing? Beschrijf hun rol en context.",en:"Who are the primary users of the solution? Describe their role and context."},
    {nl:"Zijn er secundaire gebruikers of stakeholders die indirect baat hebben?",en:"Are there secondary users or stakeholders who benefit indirectly?"},
    {nl:"Wie heeft er beslissingsbevoegdheid over deze feature? Wie is de eigenaar?",en:"Who has decision-making authority over this feature? Who is the owner?"},
    {nl:"Zijn er partijen die weerstand kunnen bieden? Waarom?",en:"Are there parties who might resist? Why?"},
  ]},
  { id:"scope", label:{nl:"Scope",en:"Scope"}, questions:[
    {nl:"Wat valt absoluut binnen scope? Noem de 3 meest essentiële onderdelen.",en:"What is absolutely within scope? Name the 3 most essential components."},
    {nl:"Wat valt expliciet BUITEN scope voor deze versie? Waarom?",en:"What is explicitly OUT of scope for this version? Why?"},
    {nl:"Zijn er technische, juridische of organisatorische beperkingen waar we rekening mee moeten houden?",en:"Are there technical, legal or organisational constraints we need to consider?"},
    {nl:"Welke integraties met bestaande systemen zijn nodig?",en:"Which integrations with existing systems are required?"},
  ]},
  { id:"privacy", label:{nl:"AVG & Privacy",en:"GDPR"}, questions:[
    {nl:"Worden er persoonsgegevens verwerkt? Zo ja, welke categorieën?",en:"Are personal data being processed? If so, which categories?"},
    {nl:"Is er al een DPIA uitgevoerd of vereist?",en:"Has a DPIA been conducted or is it required?"},
    {nl:"Wie is de verwerkingsverantwoordelijke en is de privacyofficer betrokken?",en:"Who is the data controller and is the privacy officer involved?"},
  ]},
  { id:"open", label:{nl:"Open Vragen",en:"Open Questions"}, questions:[
    {nl:"Welke informatie mis je nog om een goede beslissing te nemen?",en:"What information are you still missing to make a good decision?"},
    {nl:"Zijn er aannames die je maakt die nog gevalideerd moeten worden?",en:"Are there assumptions you're making that still need to be validated?"},
    {nl:"Wie moet je nog spreken of raadplegen voor je dit kunt starten?",en:"Who do you still need to speak to or consult before you can start this?"},
  ]},
];

const SYSTEM_PROMPT = (lang) => lang === "nl"
  ? `Je bent een ervaren product manager en business analist die een business owner interviewt om een feature beschrijving op te stellen.
Jouw taak:
- Stel verdiepende vervolgvragen gebaseerd op het antwoord van de gebruiker
- Vraag door naar het WAAROM achter antwoorden
- Identificeer tegenstrijdigheden of vaagheden en benoem die vriendelijk
- Wees concreet en direct, maar empathisch
- Houd je antwoord beknopt (max 3 zinnen + vervolgvraag)
- Sluit altijd af met één concrete vervolgvraag
- Schrijf in het Nederlands`
  : `You are an experienced product manager and business analyst interviewing a business owner to create a feature description.
Your task:
- Ask deepening follow-up questions based on the user's answer
- Probe for the WHY behind answers
- Identify contradictions or vagueness and mention them kindly
- Be concrete and direct, but empathetic
- Keep your response concise (max 3 sentences + follow-up question)
- Always end with one concrete follow-up question
- Write in English`;

function App() {
  const [fbReady, setFbReady] = useState(!!window._fbReady);
  const [user, setUser] = useState(null);
  const [lang, setLang] = useState("nl");
  const [view, setView] = useState("dashboard");
  const [sessions, setSessions] = useState([]);
  const [activeSession, setActiveSession] = useState(null);
  const [messages, setMessages] = useState([]);
  const [input, setInput] = useState("");
  const [loading, setLoading] = useState(false);
  const [stageIndex, setStageIndex] = useState(0);
  const [questionIndex, setQuestionIndex] = useState(0);
  const [document_, setDocument] = useState(null);
  const [editingDoc, setEditingDoc] = useState(false);
  const [docDraft, setDocDraft] = useState(null);
  const [newSessionTitle, setNewSessionTitle] = useState("");
  const [showNewSession, setShowNewSession] = useState(false);
  const [inviteEmail, setInviteEmail] = useState("");
  const [showMenu, setShowMenu] = useState(false);
  const [showChat, setShowChat] = useState(true);
  const [includeTranscript, setIncludeTranscript] = useState(false);
  const [knownAuthors, setKnownAuthors] = useState([]);
  const [answerAsName, setAnswerAsName] = useState(null);
  const [mentionQuery, setMentionQuery] = useState(null);
  const messageRefs = useRef({});
  const [model, setModel] = useState(() => localStorage.getItem("pd_model") || "claude-haiku-5-5");
  const [fbError, setFbError] = useState(null);
  const [showScrollTop, setShowScrollTop] = useState(false);
  const messagesEndRef = useRef(null);
  const t = (nl, en) => lang === "nl" ? nl : en;

  const MODELS = [
    { id: "claude-haiku-5-5", label: t("Haiku 5.5 (goedkoop)", "Haiku 5.5 (cheap)") },
    { id: "claude-sonnet-5-5", label: t("Sonnet 5.5 (preciezer, duurder)", "Sonnet 5.5 (sharper, pricier)") },
  ];

  const changeModel = (id) => {
    setModel(id);
    localStorage.setItem("pd_model", id);
  };

  useEffect(() => {
    if (fbReady) return;
    const handler = () => setFbReady(true);
    window.addEventListener("fb-ready", handler);
    return () => window.removeEventListener("fb-ready", handler);
  }, [fbReady]);

  useEffect(() => {
    if (!fbReady) return;
    const { onAuthStateChanged } = window._fbFns;
    return onAuthStateChanged(window._fbAuth, u => setUser(u));
  }, [fbReady]);

  useEffect(() => {
    if (!user || !fbReady) return;
    const { collection, query, orderBy, onSnapshot } = window._fbFns;
    // fix-24: sessies worden gedeeld tussen alle geautoriseerde accounts (zie
    // ALLOWED_EMAILS in de Worker en de Firestore-rules), dus geen client-side
    // filter op "members" meer — de Firestore-rules bepalen wie mag lezen.
    const q = query(
      collection(window._fbDb, "pd_sessions"),
      orderBy("createdAt", "desc")
    );
    return onSnapshot(q, snap => {
      setSessions(snap.docs.map(d => ({ id: d.id, ...d.data() })));
    }, err => {
      console.error("sessions onSnapshot error:", err);
      setFbError(`${t("Sessies laden mislukt","Failed to load sessions")}: ${err.message || err.code}`);
    });
  }, [user, fbReady]);

  useEffect(() => {
    if (!activeSession || !fbReady) return;
    const { collection, query, orderBy, onSnapshot } = window._fbFns;
    const q = query(collection(window._fbDb, "pd_sessions", activeSession.id, "messages"), orderBy("createdAt", "asc"));
    return onSnapshot(q, snap => {
      setMessages(snap.docs.map(d => ({ id: d.id, ...d.data() })));
    }, err => {
      console.error("messages onSnapshot error:", err);
      setFbError(`${t("Berichten laden mislukt","Failed to load messages")}: ${err.message || err.code}`);
    });
  }, [activeSession, fbReady]);

  useEffect(() => {
    if (!activeSession || !fbReady) return;
    const { doc, onSnapshot } = window._fbFns;
    return onSnapshot(doc(window._fbDb, "pd_documents", activeSession.id), snap => {
      if (snap.exists()) setDocument({ id: snap.id, ...snap.data() });
      else setDocument(null);
    });
  }, [activeSession, fbReady]);

  // fix-26: bekende namen van beantwoorders, voor de @mention-suggesties.
  // Groeit vanzelf aan: elke keer dat een antwoord met een (nieuwe) naam
  // wordt opgeslagen, komt die naam in de pd_authors-collectie terecht.
  useEffect(() => {
    if (!user || !fbReady) return;
    const { collection, query, orderBy, onSnapshot } = window._fbFns;
    const q = query(collection(window._fbDb, "pd_authors"), orderBy("name", "asc"));
    return onSnapshot(q, snap => {
      setKnownAuthors(snap.docs.map(d => d.data().name).filter(Boolean));
    }, err => console.error("pd_authors onSnapshot error:", err));
  }, [user, fbReady]);

  useEffect(() => {
    messagesEndRef.current?.scrollIntoView({ behavior: "smooth" });
  }, [messages]);

  useEffect(() => {
    const handler = () => setShowScrollTop(window.scrollY > 400);
    window.addEventListener("scroll", handler, { passive: true });
    return () => window.removeEventListener("scroll", handler);
  }, []);

  const scrollToTop = () => window.scrollTo({ top: 0, behavior: "smooth" });

  const login = async () => {
    const { signInWithPopup } = window._fbFns;
    window._fbGoogleProvider.setCustomParameters({ prompt: "select_account" });
    await signInWithPopup(window._fbAuth, window._fbGoogleProvider);
  };

  const createSession = async () => {
    if (!newSessionTitle.trim()) return;
    setFbError(null);
    const { collection, addDoc, serverTimestamp } = window._fbFns;
    const sessionTitle = newSessionTitle;
    try {
      const ref = await addDoc(collection(window._fbDb, "pd_sessions"), {
        title: sessionTitle, ownerId: user.uid, ownerEmail: user.email,
        ownerName: user.displayName, members: [user.email], lang,
        stageIndex: 0, questionIndex: 0, createdAt: serverTimestamp(), status: "active"
      });
      const session = { id: ref.id, title: sessionTitle, ownerId: user.uid, ownerEmail: user.email, members: [user.email], lang, stageIndex: 0, questionIndex: 0 };
      setActiveSession(session);
      setStageIndex(0); setQuestionIndex(0);
      setNewSessionTitle(""); setShowNewSession(false);
      const firstQ = INTERVIEW_STAGES[0].questions[0][lang];
      const intro = (lang === "nl")
        ? `Welkom! Ik ga je helpen om "${sessionTitle}" goed in kaart te brengen.\n\nWe doorlopen samen 7 fases: Context, Probleem, Doel, Gebruikers, Scope, AVG en Open Vragen. Aan het einde genereer ik automatisch een werkdocument.\n\nLaten we beginnen met de eerste vraag:\n\n${firstQ}`
        : `Welcome! I'll help you map out "${sessionTitle}" clearly.\n\nWe'll go through 7 phases: Context, Problem, Goal, Users, Scope, GDPR and Open Questions. At the end I'll generate a working document.\n\nLet's start with the first question:\n\n${firstQ}`;
      const msgRef = await addDoc(collection(window._fbDb, "pd_sessions", ref.id, "messages"), {
        role: "assistant", content: intro, createdAt: serverTimestamp(), stageIndex: 0
      });
      setMessages([{ id: msgRef.id, role: "assistant", content: intro, stageIndex: 0 }]);
      setView("session");
    } catch (e) {
      console.error("createSession error:", e);
      setFbError(`${t("Sessie aanmaken mislukt","Failed to create session")}: ${e.code || e.message}`);
    }
  };

  const openSession = (s) => {
    setActiveSession(s);
    setStageIndex(s.stageIndex || 0);
    setQuestionIndex(s.questionIndex || 0);
    setAnswerAsName(null); setMentionQuery(null);
    setView("session");
  };

  const deleteSession = async (s, e) => {
    e.stopPropagation();
    const ok = window.confirm(
      t(`Sessie "${s.title}" definitief verwijderen? Dit kan niet ongedaan worden gemaakt.`,
        `Permanently delete session "${s.title}"? This cannot be undone.`)
    );
    if (!ok) return;
    const { collection, doc, deleteDoc, getDocs } = window._fbFns;
    try {
      const msgsSnap = await getDocs(collection(window._fbDb, "pd_sessions", s.id, "messages"));
      await Promise.all(msgsSnap.docs.map(d => deleteDoc(d.ref)));
      await deleteDoc(doc(window._fbDb, "pd_documents", s.id)).catch(()=>{});
      await deleteDoc(doc(window._fbDb, "pd_sessions", s.id));
      if (activeSession?.id === s.id) {
        setActiveSession(null);
        setView("dashboard");
      }
    } catch (e2) {
      console.error("deleteSession error:", e2);
      setFbError(`${t("Sessie verwijderen mislukt","Failed to delete session")}: ${e2.message || e2.code}`);
    }
  };

  const registerAuthorName = async (name) => {
    if (!name) return;
    try {
      const { doc: fbDoc, setDoc, serverTimestamp } = window._fbFns;
      await setDoc(fbDoc(window._fbDb, "pd_authors", slugifyName(name)), { name, updatedAt: serverTimestamp() }, { merge: true });
    } catch (e) { console.error("registerAuthorName error:", e); }
  };

  const sendMessage = async () => {
    if (!input.trim() || loading) return;
    const userMsg = input.trim();
    const effectiveAuthorName = answerAsName || user.displayName || user.email;
    setInput(""); setLoading(true); setMentionQuery(null); setAnswerAsName(null);
    const { collection, addDoc, serverTimestamp, doc: fbDoc, updateDoc, increment } = window._fbFns;
    await addDoc(collection(window._fbDb, "pd_sessions", activeSession.id, "messages"), {
      role: "user", content: userMsg, createdAt: serverTimestamp(), stageIndex,
      authorName: effectiveAuthorName, authorEmail: user.email
    });
    registerAuthorName(effectiveAuthorName);
    const stage = INTERVIEW_STAGES[stageIndex];
    const isLastQ = questionIndex >= stage.questions.length - 1;
    const isLastStage = stageIndex >= INTERVIEW_STAGES.length - 1;
    const history = messages.map(m => ({ role: m.role, content: m.content }));
    history.push({ role: "user", content: userMsg });
    const systemContext = `${SYSTEM_PROMPT(lang)}\n\nHuidige fase: ${stage.label[lang]}\nHuidige vraag was: ${stage.questions[questionIndex][lang]}\n\n${isLastQ && !isLastStage ? `Na je reactie, introduceer de volgende fase: "${INTERVIEW_STAGES[stageIndex+1].label[lang]}" en stel de eerste vraag.` : isLastStage && isLastQ ? "Dit was de laatste vraag. Geef een afsluitende samenvatting en zeg dat het document nu gegenereerd kan worden via de knop bovenaan." : "Stel een verdiepende vervolgvraag OF beweeg naar de volgende vraag als het antwoord volledig is."}`;
    try {
      const idToken = await window._fbAuth.currentUser.getIdToken();
      const resp = await fetch("/api/claude", {
        method:"POST", headers:{"Content-Type":"application/json", "Authorization":"Bearer "+idToken},
        body: JSON.stringify({ model, max_tokens:1000, system:systemContext, messages:history })
      });
      const data = await resp.json();
      const aiText = extractText(data);
      if (!resp.ok || !aiText) {
        throw new Error(
          data.error?.message || data.error ||
          `Onverwacht antwoord (status ${resp.status}): ${JSON.stringify(data).slice(0,300)}`
        );
      }
      let newStage = stageIndex, newQ = questionIndex;
      if (isLastQ && !isLastStage) { newStage = stageIndex+1; newQ = 0; }
      else if (!isLastQ) { newQ = questionIndex+1; }
      // fix-27: tag het assistent-bericht met de NIEUWE fase (newStage) i.p.v. de
      // oude — anders werd de fase-overgangsvraag verkeerd gelabeld en vond de
      // fase-navigatie (stage-pills) geen bericht voor de zojuist gestarte fase.
      await addDoc(collection(window._fbDb, "pd_sessions", activeSession.id, "messages"), {
        role:"assistant", content:aiText, createdAt:serverTimestamp(), stageIndex:newStage
      });
      setStageIndex(newStage); setQuestionIndex(newQ);
      const inTok = data.usage?.input_tokens || 0;
      const outTok = data.usage?.output_tokens || 0;
      const cost = calcCost(model, inTok, outTok);
      await updateDoc(fbDoc(window._fbDb, "pd_sessions", activeSession.id), {
        stageIndex:newStage, questionIndex:newQ,
        costUsd: increment(cost), inputTokens: increment(inTok), outputTokens: increment(outTok)
      });
    } catch(e) {
      console.error(e);
      alert((lang==="nl" ? "Er ging iets mis: " : "Something went wrong: ") + e.message);
    }
    setLoading(false);
  };

  // fix-26: @mention-detectie — zodra je aan het einde van je tekst "@iets" typt,
  // tonen we suggesties uit knownAuthors zodat je kunt aangeven wie antwoordt.
  const handleInputChange = (e) => {
    const val = e.target.value;
    setInput(val);
    const m = val.match(/(?:^|\s)@([^\s@]*)$/);
    setMentionQuery(m ? m[1] : null);
  };

  const mentionSuggestions = mentionQuery === null ? [] :
    knownAuthors.filter(n => n.toLowerCase().includes(mentionQuery.toLowerCase())).slice(0, 5);

  const selectMention = (name) => {
    setInput(prev => prev.replace(/(?:^|\s)@([^\s@]*)$/, (match) => match.startsWith(" ") ? " " : ""));
    setAnswerAsName(name);
    setMentionQuery(null);
  };

  const scrollToStage = (i) => {
    const target = messages.find(m => (m.stageIndex ?? 0) === i);
    if (target) messageRefs.current[target.id]?.scrollIntoView({ behavior: "smooth", block: "start" });
  };

  const generateDocument = async () => {
    setLoading(true);
    const { doc: fbDoc, setDoc, updateDoc, serverTimestamp, increment } = window._fbFns;
    const convo = messages.map(m => `${m.role==="user"?"Business Owner":"Analist"}: ${m.content}`).join("\n\n");
    const prompt = `Op basis van dit interview, genereer een feature beschrijving werkdocument in JSON met deze exacte structuur:
{"title":"...","waardehypothese":"...","strategischeRelevantie":"...","voorWie":[{"rol":"...","beschrijving":"..."}],"scope":["..."],"buitenScope":["..."],"acceptatiecriteria":["..."],"avg":{"persoonsgegevens":"...","dpia":"...","verwerkingsverantwoordelijke":"..."},"openVragen":[{"vraag":"...","aanWie":"...","eigenaar":"..."}],"acties":[{"actie":"...","verantwoordelijke":"...","eigenaar":"..."}]}
Belangrijk: zorg dat de output 100% geldige JSON is. Gebruik GEEN letterlijke regelovergangen binnen een stringwaarde — gebruik daar \\n voor. Reageer ALLEEN met de JSON, geen uitleg of markdown.
Interview:\n${convo}`;
    try {
      const idToken = await window._fbAuth.currentUser.getIdToken();
      const resp = await fetch("/api/claude", {
        method:"POST", headers:{"Content-Type":"application/json", "Authorization":"Bearer "+idToken},
        body: JSON.stringify({ model, max_tokens:8192, messages:[{role:"user",content:prompt}] })
      });
      const data = await resp.json();
      const rawText = extractText(data);
      if (!resp.ok || !rawText) {
        throw new Error(
          data.error?.message || data.error ||
          `Onverwacht antwoord (status ${resp.status}): ${JSON.stringify(data).slice(0,300)}`
        );
      }
      const raw = rawText.replace(/```json|```/g,"").trim();
      let parsed;
      try {
        parsed = JSON.parse(raw);
      } catch (parseErr) {
        try {
          parsed = JSON.parse(sanitizeJsonText(raw));
        } catch (parseErr2) {
          const truncated = data.stop_reason === "max_tokens";
          throw new Error(
            (truncated
              ? (lang==="nl" ? "Antwoord was te lang en is afgekapt. " : "Response was too long and got cut off. ")
              : "") +
            `${parseErr2.message} — ${t("eerste 200 tekens van het antwoord","first 200 chars of the response")}: ${raw.slice(0,200)}`
          );
        }
      }
      await setDoc(fbDoc(window._fbDb, "pd_documents", activeSession.id), {
        ...parsed, sessionId:activeSession.id, updatedAt:serverTimestamp()
      });
      const inTok = data.usage?.input_tokens || 0;
      const outTok = data.usage?.output_tokens || 0;
      const cost = calcCost(model, inTok, outTok);
      await updateDoc(fbDoc(window._fbDb, "pd_sessions", activeSession.id), {
        costUsd: increment(cost), inputTokens: increment(inTok), outputTokens: increment(outTok)
      });
      setView("document");
    } catch(e) {
      console.error(e);
      alert((lang==="nl" ? "Genereren mislukt: " : "Generation failed: ") + e.message);
    }
    setLoading(false);
  };

  const saveDocument = async () => {
    const { doc: fbDoc, setDoc, serverTimestamp } = window._fbFns;
    await setDoc(fbDoc(window._fbDb, "pd_documents", activeSession.id), {
      ...docDraft, sessionId:activeSession.id, updatedAt:serverTimestamp()
    });
    setEditingDoc(false);
  };

  const downloadPdf = () => {
    const d = document_;
    if (!d) return;
    const pdf = new window.jspdf.jsPDF({ unit: "pt", format: "a4" });
    const pageW = pdf.internal.pageSize.getWidth();
    const pageH = pdf.internal.pageSize.getHeight();
    const marginL = 48, marginR = 48, maxW = pageW - marginL - marginR;
    let y = 56;
    const ensureSpace = (needed) => { if (y + needed > pageH - 48) { pdf.addPage(); y = 56; } };
    const heading = (text) => {
      ensureSpace(28);
      pdf.setFont("helvetica", "bold"); pdf.setFontSize(13);
      pdf.text(text, marginL, y); y += 20;
      pdf.setFont("helvetica", "normal"); pdf.setFontSize(10.5);
    };
    const paragraph = (text) => {
      if (!text) return;
      pdf.splitTextToSize(String(text), maxW).forEach(line => { ensureSpace(14); pdf.text(line, marginL, y); y += 14; });
      y += 8;
    };
    const listItem = (text) => {
      pdf.splitTextToSize("•  " + String(text), maxW).forEach(line => { ensureSpace(14); pdf.text(line, marginL, y); y += 14; });
    };

    pdf.setFont("helvetica", "bold"); pdf.setFontSize(18);
    pdf.splitTextToSize(d.title || activeSession?.title || t("Feature", "Feature"), maxW).forEach(line => { ensureSpace(24); pdf.text(line, marginL, y); y += 24; });
    y += 8;
    pdf.setFont("helvetica", "normal"); pdf.setFontSize(10.5);

    heading(t("Waardehypothese", "Value Hypothesis")); paragraph(d.waardehypothese);
    heading(t("Strategische Relevantie", "Strategic Relevance")); paragraph(d.strategischeRelevantie);

    heading(t("Voor Wie", "For Whom"));
    (d.voorWie || []).forEach(r => listItem(`${r.rol}: ${r.beschrijving}`));
    y += 6;

    heading(t("Binnen Scope", "In Scope"));
    (d.scope || []).forEach(s => listItem(s));
    y += 6;

    heading(t("Buiten Scope", "Out of Scope"));
    (d.buitenScope || []).forEach(s => listItem(s));
    y += 6;

    heading(t("Acceptatiecriteria", "Acceptance Criteria"));
    (d.acceptatiecriteria || []).forEach(s => listItem(s));
    y += 6;

    heading("AVG / GDPR");
    paragraph(`${t("Persoonsgegevens", "Personal data")}: ${d.avg?.persoonsgegevens || ""}`);
    paragraph(`DPIA: ${d.avg?.dpia || ""}`);
    paragraph(`${t("Verwerkingsverantwoordelijke", "Data controller")}: ${d.avg?.verwerkingsverantwoordelijke || ""}`);

    heading(t("Openstaande Vragen", "Open Questions"));
    (d.openVragen || []).forEach(q => listItem(`${q.vraag} (${t("aan","to")}: ${q.aanWie}, ${t("eigenaar","owner")}: ${q.eigenaar})`));
    y += 6;

    heading(t("Acties", "Actions"));
    (d.acties || []).forEach(a => listItem(`${a.actie} — ${t("verantwoordelijke","responsible")}: ${a.verantwoordelijke}, ${t("eigenaar","owner")}: ${a.eigenaar}`));

    // fix-27: optionele bijlage met het volledige interview (vraag & antwoord),
    // handig als bewijsstuk bij het feature-document.
    if (includeTranscript && messages?.length) {
      pdf.addPage(); y = 56;
      heading(t("Bijlage: Volledig interview", "Appendix: Full interview"));
      messages.forEach(m => {
        const label = m.role === "user" ? (m.authorName || t("Antwoord", "Answer")) : t("Vraag", "Question");
        ensureSpace(16);
        pdf.setFont("helvetica", "bold"); pdf.setFontSize(10.5);
        pdf.text(label + ":", marginL, y); y += 14;
        pdf.setFont("helvetica", "normal");
        paragraph(m.content);
      });
    }

    const fileName = (d.title || activeSession?.title || "feature").trim().replace(/[^\w\-]+/g, "_").replace(/^_+|_+$/g, "") + ".pdf";
    pdf.save(fileName || "feature.pdf");
  };

  const inviteStakeholder = async () => {
    if (!inviteEmail.trim() || !activeSession) return;
    const { doc: fbDoc, updateDoc } = window._fbFns;
    const newMembers = [...(activeSession.members||[]), inviteEmail.trim()];
    await updateDoc(fbDoc(window._fbDb, "pd_sessions", activeSession.id), { members: newMembers });
    setActiveSession({...activeSession, members: newMembers});

    // Open mailto with pre-filled invitation
    const appUrl = window.location.href.split("?")[0];
    const subject = encodeURIComponent(`Uitnodiging: Problem Discovery sessie "${activeSession.title}"`);
    const body = encodeURIComponent(
`Hallo,

${user.displayName} nodigt je uit om deel te nemen aan een Problem Discovery sessie.

Sessie: ${activeSession.title}

Klik op de link hieronder om in te loggen:
${appUrl}

Belangrijk: log in met dit emailadres: ${inviteEmail.trim()}

Tot zo!`
    );
    window.open(`mailto:${inviteEmail.trim()}?subject=${subject}&body=${body}`);
    setInviteEmail("");
  };

  if (!fbReady) return <div className="login-page"><div className="login-card"><div className="login-icon">⏳</div><p style={{color:"#7a7a88"}}>Firebase laden...</p></div></div>;

  if (!user) return (
    <div className="login-page">
      <div className="login-card">
        <div className="login-icon">🎯</div>
        <h1>Problem Discovery</h1>
        <p>{t("Breng samen met je business owner het probleem scherp in beeld. Van interview tot werkdocument.","Sharpen the problem definition together with your business owner. From interview to working document.")}</p>
        <button className="google-btn" onClick={login}>
          <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.874 2.684-6.615z"/><path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332C2.438 15.983 5.482 18 9 18z"/><path fill="#FBBC05" d="M3.964 10.71c-.18-.54-.282-1.117-.282-1.71s.102-1.17.282-1.71V4.958H.957C.347 6.173 0 7.548 0 9s.348 2.827.957 4.042l3.007-2.332z"/><path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0 5.482 0 2.438 2.017.957 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58z"/></svg>
          {t("Inloggen met Google","Sign in with Google")}
        </button>
      </div>
    </div>
  );

  return (
    <div className="app">
      {showScrollTop && (
        <button className="scroll-top-btn" onClick={scrollToTop} title={t("Naar boven","Scroll to top")}>↑</button>
      )}
      <nav className="nav">
        <div className="nav-brand">🎯 Problem Discovery</div>
        <div className="nav-right">
          <button className="btn-icon" onClick={()=>setShowMenu(true)} title={t("Menu","Menu")}>☰</button>
          {view!=="dashboard" && <button className="btn btn-ghost btn-sm" onClick={()=>setView("dashboard")}>← {t("Dashboard","Dashboard")}</button>}
        </div>
      </nav>

      {showMenu && (
        <>
          <div className="side-menu-backdrop" onClick={()=>setShowMenu(false)} />
          <div className="side-menu">
            <div className="side-menu-header">
              <div className="side-menu-user">
                {user.photoURL && <img src={user.photoURL} className="avatar-lg" alt="" />}
                <div>
                  <div className="side-menu-user-name">{user.displayName}</div>
                  <div className="side-menu-user-email">{user.email}</div>
                </div>
              </div>
              <button className="btn-icon" onClick={()=>setShowMenu(false)} title={t("Sluiten","Close")}>✕</button>
            </div>
            <div className="side-menu-section">
              <label>{t("Taal","Language")}</label>
              <div className="lang-toggle">
                <button className={`lang-btn ${lang==="nl"?"active":""}`} onClick={()=>setLang("nl")}>NL</button>
                <button className={`lang-btn ${lang==="en"?"active":""}`} onClick={()=>setLang("en")}>EN</button>
              </div>
            </div>
            <div className="side-menu-section">
              <label>{t("AI-model","AI model")}</label>
              <select className="model-select" style={{width:"100%"}} value={model} onChange={e=>changeModel(e.target.value)}>
                {MODELS.map(m => <option key={m.id} value={m.id}>{m.label}</option>)}
              </select>
            </div>
            <button className="btn btn-ghost" onClick={()=>window._fbFns.signOut(window._fbAuth)}>{t("Uitloggen","Sign out")}</button>
            <div className="side-menu-version">{APP_BUILD}</div>
          </div>
        </>
      )}

      {fbError && (
        <div className="fb-error-banner">
          <span>⚠️ {linkify(fbError)}</span>
          <button className="fb-error-dismiss" onClick={()=>setFbError(null)}>✕</button>
        </div>
      )}

      {view==="dashboard" && (
        <div className="dashboard">
          <div className="dashboard-header">
            <h2>{t("Mijn sessies","My sessions")}</h2>
            <button className="btn btn-primary" onClick={()=>setShowNewSession(!showNewSession)}>+ {t("Nieuwe sessie","New session")}</button>
          </div>
          {showNewSession && (
            <div className="new-session-form">
              <label style={{fontSize:".8rem",color:"#9a9aa8",display:"block",marginBottom:".4rem"}}>{t("Naam van de feature","Name of the feature")}</label>
              <div className="input-row">
                <input className="input" placeholder={t("bv. Klantportaal self-service","e.g. Customer portal self-service")} value={newSessionTitle} onChange={e=>setNewSessionTitle(e.target.value)} onKeyDown={e=>e.key==="Enter"&&createSession()} />
                <button className="btn btn-primary" onClick={createSession}>{t("Start","Start")}</button>
                <button className="btn btn-ghost" onClick={()=>setShowNewSession(false)}>✕</button>
              </div>
            </div>
          )}
          <div className="sessions-grid">
            {sessions.length===0 && !showNewSession && <div className="empty-state"><div className="icon">💡</div><p>{t("Nog geen sessies. Start een nieuwe sessie om een probleem te verkennen.","No sessions yet. Start a new session to explore a problem.")}</p></div>}
            {sessions.map(s=>(
              <div key={s.id} className="session-card" onClick={()=>openSession(s)}>
                <div>
                  <div className="session-title">{s.title}</div>
                  <div className="session-meta">{s.ownerName} · {s.members?.length||1} {t("deelnemers","participants")} · fase {(s.stageIndex||0)+1}/{INTERVIEW_STAGES.length} · ${(s.costUsd||0).toFixed(4)}</div>
                </div>
                <div style={{display:"flex",alignItems:"center",gap:".6rem"}}>
                  <span className="session-badge">{INTERVIEW_STAGES[s.stageIndex||0]?.label[lang]}</span>
                  <button className="session-delete-btn" onClick={(e)=>deleteSession(s,e)} title={t("Sessie verwijderen","Delete session")}>🗑️</button>
                </div>
              </div>
            ))}
          </div>
        </div>
      )}

      {view==="session" && activeSession && (
        <div className="session-layout">
          <div className="session-topbar">
            <div className="session-title-bar">{activeSession.title}</div>
            <div className="stage-pills">
              {INTERVIEW_STAGES.map((s,i)=>(
                <button
                  key={s.id}
                  className={`stage-pill ${i<stageIndex?"done":i===stageIndex?"active":""} ${i>stageIndex?"future":""}`}
                  onClick={()=>i<=stageIndex && scrollToStage(i)}
                  title={i>stageIndex ? t("Nog niet begonnen","Not started yet") : t("Ga naar dit blok","Jump to this block")}
                >{s.label[lang]}</button>
              ))}
            </div>
            <div className="cost-badge" title={t("Geschatte API-kosten van deze sessie","Estimated API cost for this session")}>
              💰 ${((sessions.find(s=>s.id===activeSession.id)?.costUsd) || 0).toFixed(4)}
            </div>
          </div>
          <div className="chat-toggle-row">
            <button className="chat-toggle-btn" onClick={()=>setShowChat(!showChat)}>
              {showChat ? "▾" : "▸"} {t("Vraag & antwoord","Q&A")}
            </button>
          </div>
          {showChat && (
            <div className="chat-area">
              {messages.map((m,i)=>(
                <React.Fragment key={m.id}>
                  <div className={`msg ${m.role}`} ref={el=>{messageRefs.current[m.id]=el;}}>
                    <div className="msg-group">
                      {m.role==="user" && m.authorName && <div className="msg-author">{m.authorName}</div>}
                      <div className="msg-bubble">{m.content}</div>
                    </div>
                  </div>
                  {i===messages.length-1 && !loading && (
                    <div className="input-col">
                      {mentionSuggestions.length>0 && (
                        <div className="mention-dropdown">
                          {mentionSuggestions.map(name=>(
                            <button key={name} className="mention-item" onClick={()=>selectMention(name)}>@{name}</button>
                          ))}
                        </div>
                      )}
                      {answerAsName && (
                        <div className="answer-as-pill">
                          {t("Antwoord namens","Answering as")}: {answerAsName}
                          <button onClick={()=>setAnswerAsName(null)} title={t("Terug naar eigen account","Back to own account")}>✕</button>
                        </div>
                      )}
                      <div className="inline-input-row">
                        <textarea
                          className="chat-textarea"
                          placeholder={t("Typ je antwoord... (@naam om namens iemand anders te antwoorden)","Type your answer... (@name to answer on someone else's behalf)")}
                          value={input}
                          onChange={handleInputChange}
                          rows={1}
                          autoFocus
                        />
                        <button className="send-btn" onClick={sendMessage} disabled={!input.trim()} title={t("Versturen","Send")}>↑</button>
                      </div>
                    </div>
                  )}
                </React.Fragment>
              ))}
              {loading && <div className="msg assistant"><div className="msg-bubble"><div className="typing"><div className="dot"/><div className="dot"/><div className="dot"/></div></div></div>}
              <div ref={messagesEndRef}/>
            </div>
          )}
          <div className="session-actions">
            {document_ && <button className="btn btn-primary btn-sm" onClick={()=>setView("document")}>📄 {t("Document","Document")}</button>}
            <button className="btn btn-ghost btn-sm" onClick={generateDocument} disabled={loading}>{loading?"⏳":"✨"} {t("Genereer document","Generate document")}</button>
          </div>
        </div>
      )}

      {view==="document" && document_ && (
        <div className="doc-view">
          <div className="doc-header">
            <div className="doc-title">{document_.title||activeSession?.title}</div>
            <div className="doc-header-actions" style={{display:"flex",gap:".5rem",alignItems:"center",flexWrap:"wrap"}}>
              {editingDoc
                ? <><button className="btn btn-primary btn-sm" onClick={saveDocument}>💾 {t("Opslaan","Save")}</button><button className="btn btn-ghost btn-sm" onClick={()=>setEditingDoc(false)}>✕</button></>
                : <>
                    <label style={{display:"flex",alignItems:"center",gap:".35rem",fontSize:".78rem",color:"#9a9aa8",cursor:"pointer"}}>
                      <input type="checkbox" checked={includeTranscript} onChange={e=>setIncludeTranscript(e.target.checked)} />
                      {t("Incl. vraag & antwoord lijst","Incl. Q&A list")}
                    </label>
                    <button className="btn btn-ghost btn-sm" onClick={()=>{setDocDraft({...document_});setEditingDoc(true);}}>✏️ {t("Bewerken","Edit")}</button>
                    <button className="btn btn-ghost btn-sm" onClick={downloadPdf}>📄 {t("Download als PDF","Download as PDF")}</button>
                  </>
              }
            </div>
          </div>

          <div className="doc-section">
            <div className="doc-section-title">💡 {t("Waardehypothese","Value Hypothesis")}</div>
            {editingDoc?<textarea className="textarea-edit" value={docDraft.waardehypothese} onChange={e=>setDocDraft({...docDraft,waardehypothese:e.target.value})}/>:<p>{document_.waardehypothese}</p>}
          </div>
          <div className="doc-section">
            <div className="doc-section-title">🎯 {t("Strategische Relevantie","Strategic Relevance")}</div>
            {editingDoc?<textarea className="textarea-edit" value={docDraft.strategischeRelevantie} onChange={e=>setDocDraft({...docDraft,strategischeRelevantie:e.target.value})}/>:<p>{document_.strategischeRelevantie}</p>}
          </div>
          <div className="doc-section">
            <div className="doc-section-title">👥 {t("Voor Wie","For Whom")}</div>
            {(editingDoc?docDraft.voorWie:document_.voorWie)?.map((r,i)=>(
              <div key={i} className="role-card">
                {editingDoc
                  ? <><input className="input-edit" style={{marginBottom:".4rem"}} placeholder="Rol" value={docDraft.voorWie[i].rol} onChange={e=>{const v=[...docDraft.voorWie];v[i]={...v[i],rol:e.target.value};setDocDraft({...docDraft,voorWie:v})}}/><input className="input-edit" placeholder="Beschrijving" value={docDraft.voorWie[i].beschrijving} onChange={e=>{const v=[...docDraft.voorWie];v[i]={...v[i],beschrijving:e.target.value};setDocDraft({...docDraft,voorWie:v})}}/></>
                  : <><div className="role-name">{r.rol}</div><div className="role-desc">{r.beschrijving}</div></>}
              </div>
            ))}
          </div>
          <div className="doc-section scope-grid">
            <div>
              <div className="doc-section-title">✅ {t("Binnen Scope","In Scope")}</div>
              <ul className="doc-list">{(editingDoc?docDraft.scope:document_.scope)?.map((s,i)=><li key={i}>{editingDoc?<input className="input-edit" value={docDraft.scope[i]} onChange={e=>{const v=[...docDraft.scope];v[i]=e.target.value;setDocDraft({...docDraft,scope:v})}}/>:s}</li>)}</ul>
            </div>
            <div>
              <div className="doc-section-title">🚫 {t("Buiten Scope","Out of Scope")}</div>
              <ul className="doc-list">{(editingDoc?docDraft.buitenScope:document_.buitenScope)?.map((s,i)=><li key={i}>{editingDoc?<input className="input-edit" value={docDraft.buitenScope[i]} onChange={e=>{const v=[...docDraft.buitenScope];v[i]=e.target.value;setDocDraft({...docDraft,buitenScope:v})}}/>:s}</li>)}</ul>
            </div>
          </div>
          <div className="doc-section">
            <div className="doc-section-title">☑️ {t("Acceptatiecriteria","Acceptance Criteria")}</div>
            <ul className="doc-list">{(editingDoc?docDraft.acceptatiecriteria:document_.acceptatiecriteria)?.map((s,i)=><li key={i}>{editingDoc?<input className="input-edit" value={docDraft.acceptatiecriteria[i]} onChange={e=>{const v=[...docDraft.acceptatiecriteria];v[i]=e.target.value;setDocDraft({...docDraft,acceptatiecriteria:v})}}/>:s}</li>)}</ul>
          </div>
          <div className="doc-section">
            <div className="doc-section-title">🔒 AVG / GDPR</div>
            <div className="avg-grid">
              {["persoonsgegevens","dpia","verwerkingsverantwoordelijke"].map(key=>(
                <div className="avg-item" key={key}>
                  <label>{key==="persoonsgegevens"?t("Persoonsgegevens","Personal data"):key==="dpia"?"DPIA":t("Verwerkingsverantwoordelijke","Data controller")}</label>
                  {editingDoc?<input className="input-edit" value={docDraft.avg?.[key]||""} onChange={e=>setDocDraft({...docDraft,avg:{...docDraft.avg,[key]:e.target.value}})}/>:<p>{document_.avg?.[key]}</p>}
                </div>
              ))}
            </div>
          </div>
          <div className="doc-section">
            <div className="doc-section-title">❓ {t("Openstaande Vragen","Open Questions")}</div>
            <table className="oq-table">
              <thead><tr><th>{t("Vraag","Question")}</th><th>{t("Aan wie","To whom")}</th><th>{t("Eigenaar","Owner")}</th></tr></thead>
              <tbody>
                {(editingDoc?docDraft.openVragen:document_.openVragen)?.map((q,i)=>(
                  <tr key={i}>
                    {editingDoc
                      ? <><td><input className="input-edit" value={docDraft.openVragen[i].vraag} onChange={e=>{const v=[...docDraft.openVragen];v[i]={...v[i],vraag:e.target.value};setDocDraft({...docDraft,openVragen:v})}}/></td><td><input className="input-edit" value={docDraft.openVragen[i].aanWie} onChange={e=>{const v=[...docDraft.openVragen];v[i]={...v[i],aanWie:e.target.value};setDocDraft({...docDraft,openVragen:v})}}/></td><td><input className="input-edit" value={docDraft.openVragen[i].eigenaar} onChange={e=>{const v=[...docDraft.openVragen];v[i]={...v[i],eigenaar:e.target.value};setDocDraft({...docDraft,openVragen:v})}}/></td></>
                      : <><td>{q.vraag}</td><td>{q.aanWie}</td><td><span className="owner-chip">{q.eigenaar}</span></td></>}
                  </tr>
                ))}
              </tbody>
            </table>
            {editingDoc && <button className="add-row-btn" onClick={()=>setDocDraft({...docDraft,openVragen:[...(docDraft.openVragen||[]),{vraag:"",aanWie:"",eigenaar:""}]})}>+ {t("Vraag toevoegen","Add question")}</button>}
          </div>
          <div className="doc-section">
            <div className="doc-section-title">⚡ {t("Acties","Actions")}</div>
            <table className="oq-table">
              <thead><tr><th>{t("Actie","Action")}</th><th>{t("Verantwoordelijke","Responsible")}</th><th>{t("Eigenaar","Owner")}</th></tr></thead>
              <tbody>
                {(editingDoc?docDraft.acties:document_.acties)?.map((a,i)=>(
                  <tr key={i}>
                    {editingDoc
                      ? <><td><input className="input-edit" value={docDraft.acties[i].actie} onChange={e=>{const v=[...docDraft.acties];v[i]={...v[i],actie:e.target.value};setDocDraft({...docDraft,acties:v})}}/></td><td><input className="input-edit" value={docDraft.acties[i].verantwoordelijke} onChange={e=>{const v=[...docDraft.acties];v[i]={...v[i],verantwoordelijke:e.target.value};setDocDraft({...docDraft,acties:v})}}/></td><td><input className="input-edit" value={docDraft.acties[i].eigenaar} onChange={e=>{const v=[...docDraft.acties];v[i]={...v[i],eigenaar:e.target.value};setDocDraft({...docDraft,acties:v})}}/></td></>
                      : <><td>{a.actie}</td><td>{a.verantwoordelijke}</td><td><span className="owner-chip">{a.eigenaar}</span></td></>}
                  </tr>
                ))}
              </tbody>
            </table>
            {editingDoc && <button className="add-row-btn" onClick={()=>setDocDraft({...docDraft,acties:[...(docDraft.acties||[]),{actie:"",verantwoordelijke:"",eigenaar:""}]})}>+ {t("Actie toevoegen","Add action")}</button>}
          </div>
        </div>
      )}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App/>);
</script>
</body>
</html>
